name: CI Nanda

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:

  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Python
        id: prep
        uses: ./.github/actions/preparer-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Afficher l'environnement
        run: |
          echo "Python installé : ${{ steps.prep.outputs.python-version }}"
          echo "Cache retrouvé  : ${{ steps.prep.outputs.cache-hit }}"

      - name: Vérifier le formatage
        run: black --check --diff .

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Python
        uses: ./.github/actions/preparer-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lancer les tests
        run: python -m pytest -v

  version:
    name: Version
    needs: [qualite, tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      officielle: ${{ steps.version.outputs.officielle }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculer la version
        id: version
        uses: ./.github/actions/calculer-version
        with:
          version-base: ${{ vars.VERSION_BASE || '0.1' }}

      - name: Publier un résumé
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OFFICIELLE: ${{ steps.version.outputs.officielle }}
        run: |
          echo "## Version $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Version officielle : $OFFICIELLE" >> "$GITHUB_STEP_SUMMARY"
